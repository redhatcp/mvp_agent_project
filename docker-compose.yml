version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  celery:
    build: ./backend
    command: celery -A tasks.celery_app worker --loglevel=info
    depends_on:
      - redis